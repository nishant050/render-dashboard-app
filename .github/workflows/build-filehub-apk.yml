name: Build FileHub Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-filehub-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build Debug APKs with Gradle
        working-directory: ./android
        run: |
          set -o pipefail
          gradle :app:assembleFilehubDebug :app:assembleDashboardDebug --no-daemon --stacktrace 2>&1 | tee build_output.log || {
            echo "::error::Gradle Build Failed! Printing log excerpt:"
            grep -E "error:|FAILED|Exception|Caused by:" build_output.log | head -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 30 build_output.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
          echo "=== APK SEARCH IN ANDROID DIR ==="
          find . -name "*.apk"

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/build_output.log

      - name: Organize APKs for Distribution
        run: |
          mkdir -p build-output
          FILEHUB_APK=$(find android -name "*filehub*debug*.apk" | head -n 1)
          DASHBOARD_APK=$(find android -name "*dashboard*debug*.apk" | head -n 1)

          echo "Found FileHub APK at: $FILEHUB_APK"
          echo "Found Dashboard APK at: $DASHBOARD_APK"

          if [ -n "$FILEHUB_APK" ]; then
            cp "$FILEHUB_APK" build-output/FileHub.apk
          else
            echo "::error::FileHub APK not found!"
            exit 1
          fi

          if [ -n "$DASHBOARD_APK" ]; then
            cp "$DASHBOARD_APK" build-output/RenderDashboard.apk
          else
            echo "::error::Dashboard APK not found!"
            exit 1
          fi

          ls -la build-output/

      - name: Upload FileHub APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileHub-APK
          path: build-output/FileHub.apk
          if-no-files-found: error

      - name: Upload Render Dashboard APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenderDashboard-APK
          path: build-output/RenderDashboard.apk
          if-no-files-found: error

      - name: Publish / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: filehub-apk-latest
          name: "FileHub & Render Dashboard Android Apps"
          body: |
            Official Android APK releases:
            - **RenderDashboard.apk**: Complete web dashboard & media streaming gateway app with Render proxy bypassing device DNS restrictions, native YouTube video player, and integrated FileHub sharing.
            - **FileHub.apk**: Standalone lightweight FileHub client with native share sheet support, background upload queue, and master password security.
          files: |
            build-output/FileHub.apk
            build-output/RenderDashboard.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
