name: Build FileHub Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-filehub-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.log || {
            echo "::error::Gradle Build Failed! Check the summary below."
            echo "### ❌ Gradle Build Error Details" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "error:|FAILED|Exception|Caused by:" build_output.log | head -n 40 >> $GITHUB_STEP_SUMMARY || cat build_output.log | tail -n 40 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          echo "=== APK SEARCH IN ANDROID DIR ==="
          find . -name "*.apk"

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/build_output.log

      - name: Rename APK for Distribution
        run: |
          mkdir -p build-output
          APK_PATH=$(find . -name "*.apk" | grep -i "debug" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" | head -n 1)
          fi
          echo "Found generated APK at: $APK_PATH"
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK file found in repository after build!"
            find . -name "build" -type d
            exit 1
          fi
          cp "$APK_PATH" build-output/FileHub.apk
          ls -la build-output/FileHub.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileHub-APK
          path: build-output/FileHub.apk
          if-no-files-found: error

      - name: Publish / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: filehub-apk-latest
          name: "FileHub Android App Release"
          body: "Official Android APK for FileHub with Native Share Sheet support, background upload queue, and master password authentication."
          files: build-output/FileHub.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
