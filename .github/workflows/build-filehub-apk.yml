name: Build FileHub Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-filehub-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.log || {
            echo "::error::Gradle Build Failed! Printing log excerpt:"
            grep -E "error:|FAILED|Exception|Caused by:" build_output.log | head -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 30 build_output.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
          echo "=== APK SEARCH IN ANDROID DIR ==="
          find . -name "*.apk"

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/build_output.log

      - name: Organize APKs for Distribution
        run: |
          mkdir -p build-output
          APK_FILE=$(find android -name "*debug*.apk" | head -n 1)

          echo "Found compiled APK at: $APK_FILE"

          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" build-output/FileHub.apk
            cp "$APK_FILE" build-output/RenderDashboard.apk
          else
            echo "::error::Compiled APK not found!"
            exit 1
          fi

          ls -la build-output/

      - name: Upload FileHub APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileHub-APK
          path: build-output/FileHub.apk
          if-no-files-found: error

      - name: Upload Render Dashboard APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenderDashboard-APK
          path: build-output/RenderDashboard.apk
          if-no-files-found: error

      - name: Publish / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: filehub-apk-latest
          name: "FileHub & Learn Investing v1.1.0"
          body: |
            Official Release v1.1.0:
            - **Inbuilt Learn Investing UI**: Offline-ready local assets, 100% self-contained Vanilla CSS, no CDN reliance.
            - **Native FileHub Explorer**: Folder uploads fix (files upload into current subfolder), smooth scroll without refresh glitches.
            - **Fixed Native Share Target**: Instant stream caching before activity finish, eliminating Android permission revocation.
            - **In-App Updater**: Check for updates and install new versions directly inside the app.
          files: |
            build-output/FileHub.apk
            build-output/RenderDashboard.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
