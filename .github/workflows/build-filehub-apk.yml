name: Build FileHub Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-filehub-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.log || {
            echo "::error::Gradle Build Failed! Printing log excerpt:"
            grep -E "error:|FAILED|Exception|Caused by:" build_output.log | head -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 30 build_output.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
          echo "=== APK SEARCH IN ANDROID DIR ==="
          find . -name "*.apk"

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/build_output.log

      - name: Organize APKs for Distribution
        run: |
          mkdir -p build-output
          APK_FILE=$(find android -name "*debug*.apk" | head -n 1)

          echo "Found compiled APK at: $APK_FILE"

          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" build-output/FileHub.apk
            cp "$APK_FILE" build-output/RenderDashboard.apk
          else
            echo "::error::Compiled APK not found!"
            exit 1
          fi

          ls -la build-output/

      - name: Upload FileHub APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileHub-APK
          path: build-output/FileHub.apk
          if-no-files-found: error

      - name: Upload Render Dashboard APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenderDashboard-APK
          path: build-output/RenderDashboard.apk
          if-no-files-found: error

      - name: Publish / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: filehub-apk-latest
          name: "FileHub & Learn Investing v1.1.3"
          body: |
            Security release v1.1.3:
            - **Password never exposed to web content**: Learn Investing talks to your server through a native bridge; the dashboard password is no longer readable from JavaScript or embedded YouTube frames.
            - **Signed video streams**: "Play via my server" uses short-lived signed links (the stream endpoint is no longer public).
            - **Share confirmation**: shared files are uploaded only after you tap Upload, and only real shared content is accepted.
            - **Hardened storage**: app data is excluded from backups/device transfer, the APK is non-debuggable, and plain-HTTP servers are refused.
            - External links from Learn Investing open in your browser instead of inside the app.
          files: |
            build-output/FileHub.apk
            build-output/RenderDashboard.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
