<div class="suggestions-list">
    <h4 style="margin-bottom: 1rem;">Suggested Alternatives</h4>
    {% for alt in alternatives %}
    <div class="alt-card glass-card">
        <div class="alt-card-body">
            <h5 class="alt-card-name">{{ alt.dish_name }}</h5>
            {% if alt.description %}
            <p class="alt-card-desc">{{ alt.description }}</p>
            {% endif %}
            <div class="meal-card-bottom" style="padding: 0; border: none; margin-top: 0.6rem;">
                <span class="meal-cal" style="font-size: 0.8rem;">{{ alt.calories }} kcal</span>
                <div class="meal-macros" style="font-size: 0.8rem; gap: 0.3rem;">
                    <span class="macro protein">P: {{ alt.protein_g }}g</span>
                    <span class="macro carbs">C: {{ alt.carbs_g }}g</span>
                    <span class="macro fat">F: {{ alt.fat_g }}g</span>
                </div>
            </div>
        </div>
        <form hx-post="/dietplan/meal/replace/confirm/{{ str(meal_id) }}"
              hx-swap="innerHTML" hx-target="closest .dish-modal-overlay"
              style="margin-top: 0.8rem;">
            <input type="hidden" name="alt_json" value='{{ alt_json_list[loop.index0] }}'>
            <button type="submit" class="btn btn-primary btn-sm" style="width: 100%;">Select This Meal</button>
        </form>
    </div>
    {% endfor %}
</div>
