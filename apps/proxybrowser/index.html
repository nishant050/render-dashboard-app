<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Browser</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="browser-container">
        <!-- Top bar containing window controls and tabs -->
        <div class="browser-tabs-header">
            <div class="window-controls">
                <span class="dot close" onclick="window.location.href='/'" title="Close Browser"></span>
                <span class="dot minimize" onclick="window.location.href='/'" title="Minimize"></span>
                <span class="dot maximize" title="Maximize"></span>
            </div>
            
            <div class="tabs-wrapper">
                <div id="tabs-list" class="tabs-list">
                    <!-- Tabs will be dynamically generated here -->
                </div>
                <button id="add-tab-btn" class="add-tab-btn" title="New Tab">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
            </div>
        </div>

        <!-- Navigation and Address bar -->
        <div class="browser-nav-header">
            <div class="navigation-controls">
                <button id="back-btn" title="Go Back" disabled>
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </button>
                <button id="forward-btn" title="Go Forward" disabled>
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
                <button id="refresh-btn" title="Reload">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                </button>
            </div>
            
            <form id="url-form" class="address-bar-container">
                <div class="secure-icon">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                </div>
                <input type="text" id="url-input" class="address-bar" placeholder="Search with DuckDuckGo or enter URL" autocomplete="off" spellcheck="false">
                <button type="submit" class="go-btn">Go</button>
            </form>
            
            <div class="menu-controls">
                <a href="/" class="home-btn" title="Dashboard">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </a>
            </div>
            
            <!-- Loading indicator bar -->
            <div id="loading-bar" class="loading-bar"></div>
        </div>

        <!-- Main content: houses the dynamic iframes -->
        <div id="browser-content" class="browser-content">
            <!-- Iframes will be dynamically injected here, one per tab -->
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
