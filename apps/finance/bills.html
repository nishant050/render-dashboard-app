<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RupeeTracker — Bills</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
</head>

<body>

    <!-- SIDEBAR NAVIGATION -->
    <nav class="sidebar">
        <div class="sidebar-logo">💰 RupeeTracker</div>
        <a href="/finance/" class="nav-link">📊 Dashboard</a>
        <a href="/finance/transactions.html" class="nav-link">💸 Transactions</a>
        <a href="/finance/budget.html" class="nav-link">📋 Budget</a>
        <a href="/finance/bills.html" class="nav-link active">📅 Bills</a>
        <a href="/finance/goals.html" class="nav-link">🎯 Goals</a>
        <a href="/finance/calculators.html" class="nav-link">🧮 Calculators</a>
        <a href="/finance/reports.html" class="nav-link">📈 Reports</a>
        <a href="/finance/accounts.html" class="nav-link">🏦 Accounts</a>
        <a href="/finance/settings.html" class="nav-link">⚙️ Settings</a>
        <a href="/" class="nav-link nav-back">← Back to Dashboard</a>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="content">
        <header class="page-header">
            <button class="menu-toggle">☰</button>
            <h1>Bills & Subscriptions</h1>
            <div class="month-navigator">
                <button id="prev-month">◀</button>
                <span id="current-month">June 2025</span>
                <button id="next-month">▶</button>
            </div>
        </header>

        <div class="page-body">
            <!-- Add Bill Button -->
            <div class="quick-actions">
                <button class="btn btn-primary" id="add-bill-btn">➕ Add Bill</button>
                <button class="btn btn-ghost" id="toggle-view-btn">📅 Calendar View</button>
            </div>

            <!-- Bills Summary -->
            <div class="bills-summary" id="bills-summary">
                <div class="summary-card">
                    <div class="summary-card-icon">⏳</div>
                    <div class="summary-card-label">Total Pending</div>
                    <div class="summary-card-value" id="total-pending">₹0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-card-icon">✅</div>
                    <div class="summary-card-label">Total Paid</div>
                    <div class="summary-card-value amount-positive" id="total-paid">₹0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-card-icon">⚠️</div>
                    <div class="summary-card-label">Overdue</div>
                    <div class="summary-card-value amount-negative" id="total-overdue">₹0</div>
                </div>
            </div>

            <!-- Filter Tabs -->
            <div class="tabs" id="bill-tabs">
                <button class="tab-btn active" data-status="all">All</button>
                <button class="tab-btn" data-status="pending">Pending</button>
                <button class="tab-btn" data-status="paid">Paid</button>
                <button class="tab-btn" data-status="overdue">Overdue</button>
            </div>

            <!-- Bill List -->
            <div id="bill-list">
                <div class="empty-state">
                    <div class="empty-state-icon">📅</div>
                    <div class="empty-state-title">No Bills Found</div>
                    <div class="empty-state-text">Add recurring bills to track them</div>
                </div>
            </div>

            <!-- Calendar View (hidden by default) -->
            <div id="calendar-view" class="hidden">
                <div class="calendar-grid" id="calendar-grid">
                    <!-- Calendar will be rendered here -->
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL CONTAINER -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title"></h2>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Scripts -->
    <script src="common.js"></script>
    <script src="bills.js"></script>

</body>

</html>
