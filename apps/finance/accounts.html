<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RupeeTracker — Accounts</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
</head>

<body>

    <!-- SIDEBAR NAVIGATION -->
    <nav class="sidebar">
        <div class="sidebar-logo">💰 RupeeTracker</div>
        <a href="/finance/" class="nav-link">📊 Dashboard</a>
        <a href="/finance/transactions.html" class="nav-link">💸 Transactions</a>
        <a href="/finance/budget.html" class="nav-link">📋 Budget</a>
        <a href="/finance/bills.html" class="nav-link">📅 Bills</a>
        <a href="/finance/goals.html" class="nav-link">🎯 Goals</a>
        <a href="/finance/calculators.html" class="nav-link">🧮 Calculators</a>
        <a href="/finance/reports.html" class="nav-link">📈 Reports</a>
        <a href="/finance/accounts.html" class="nav-link active">🏦 Accounts</a>
        <a href="/finance/settings.html" class="nav-link">⚙️ Settings</a>
        <a href="/" class="nav-link nav-back">← Back to Dashboard</a>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="content">
        <header class="page-header">
            <button class="menu-toggle">☰</button>
            <h1>Accounts</h1>
            <div class="flex gap-sm">
                <button class="btn btn-ghost" id="transfer-btn">↔️ Transfer</button>
                <button class="btn btn-primary" id="add-account-btn">+ Add Account</button>
            </div>
        </header>

        <div class="page-body">
            <!-- Net Worth Display -->
            <div class="net-worth-display" id="net-worth-display">
                <div class="net-worth-label">Net Worth</div>
                <div class="net-worth-value" id="net-worth-value">₹0</div>
            </div>

            <!-- Accounts Grid -->
            <div id="accounts-grid">
                <div class="empty-state">
                    <div class="empty-state-icon">🏦</div>
                    <div class="empty-state-title">No Accounts</div>
                    <p>Add your bank accounts, wallets, and credit cards</p>
                    <button class="btn btn-primary mt-md" onclick="openAccountForm()">Add Your First Account</button>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL CONTAINER -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title"></h2>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Scripts -->
    <script src="common.js"></script>
    <script src="accounts.js"></script>

</body>

</html>
