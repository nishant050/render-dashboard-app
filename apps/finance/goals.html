<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RupeeTracker — Goals</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
</head>

<body>

    <!-- SIDEBAR NAVIGATION -->
    <nav class="sidebar">
        <div class="sidebar-logo">💰 RupeeTracker</div>
        <a href="/finance/" class="nav-link">📊 Dashboard</a>
        <a href="/finance/transactions.html" class="nav-link">💸 Transactions</a>
        <a href="/finance/budget.html" class="nav-link">📋 Budget</a>
        <a href="/finance/bills.html" class="nav-link">📅 Bills</a>
        <a href="/finance/goals.html" class="nav-link active">🎯 Goals</a>
        <a href="/finance/calculators.html" class="nav-link">🧮 Calculators</a>
        <a href="/finance/reports.html" class="nav-link">📈 Reports</a>
        <a href="/finance/accounts.html" class="nav-link">🏦 Accounts</a>
        <a href="/finance/settings.html" class="nav-link">⚙️ Settings</a>
        <a href="/" class="nav-link nav-back">← Back to Dashboard</a>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="content">
        <header class="page-header">
            <button class="menu-toggle">☰</button>
            <h1>Savings Goals</h1>
        </header>

        <div class="page-body">
            <!-- Add Goal Button -->
            <div class="quick-actions">
                <button class="btn btn-primary" id="add-goal-btn">➕ Add Goal</button>
            </div>

            <!-- Goals Summary -->
            <div class="goals-summary" id="goals-summary">
                <div class="summary-card">
                    <div class="summary-card-icon">💰</div>
                    <div class="summary-card-label">Total Saved</div>
                    <div class="summary-card-value amount-positive" id="total-saved">₹0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-card-icon">🎯</div>
                    <div class="summary-card-label">Total Remaining</div>
                    <div class="summary-card-value" id="total-remaining">₹0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-card-icon">📊</div>
                    <div class="summary-card-label">Active Goals</div>
                    <div class="summary-card-value" id="active-count">0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-card-icon">🎉</div>
                    <div class="summary-card-label">Completed</div>
                    <div class="summary-card-value" id="completed-count">0</div>
                </div>
            </div>

            <!-- Goal Grid -->
            <div id="goal-grid">
                <div class="empty-state">
                    <div class="empty-state-icon">🎯</div>
                    <div class="empty-state-title">No Goals Set</div>
                    <div class="empty-state-text">Create your first savings goal to start tracking</div>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL CONTAINER -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title"></h2>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Scripts -->
    <script src="common.js"></script>
    <script src="goals.js"></script>

</body>

</html>
