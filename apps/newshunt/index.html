<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="NewsHunt — AI-powered news aggregator that reads, rates, and rewrites news for you.">
    <title>NewsHunt — Smart News Reader</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/reader.css">

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Favicon -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>">
</head>

<body>
    <div class="app">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar__logo">
                <div class="sidebar__logo-icon">📰</div>
                <span class="sidebar__logo-text">NewsHunt</span>
            </div>

            <nav class="sidebar__nav">
                <button class="sidebar__nav-item sidebar__nav-item--active" data-view="feed">
                    <span class="sidebar__nav-icon">🏠</span>
                    <span>Feed</span>
                    <span class="sidebar__nav-badge" style="display:none">0</span>
                </button>

                <button class="sidebar__nav-item" data-view="read">
                    <span class="sidebar__nav-icon">📚</span>
                    <span>Read</span>
                    <span class="sidebar__nav-badge" style="display:none">0</span>
                </button>

                <button class="sidebar__nav-item" data-view="topics">
                    <span class="sidebar__nav-icon">🏷️</span>
                    <span>Topics</span>
                </button>

                <button class="sidebar__nav-item" data-view="settings">
                    <span class="sidebar__nav-icon">⚙️</span>
                    <span>Settings</span>
                </button>
            </nav>

            <div class="sidebar__footer">
                <button class="sidebar__nav-item sidebar__nav-item--close"
                    onclick="if(confirm('Close NewsHunt?')) window.close();">
                    <span class="sidebar__nav-icon">❌</span>
                    <span>Close App</span>
                </button>
                <button class="sidebar__nav-item" onclick="window.open('https://github.com', '_blank')">
                    <span class="sidebar__nav-icon">💡</span>
                    <span style="font-size: var(--text-xs); color: var(--color-text-muted)">NewsHunt v1.0</span>
                </button>
            </div>
        </aside>

        <!-- Mobile Toggle -->
        <button class="sidebar__mobile-toggle" onclick="App.toggleSidebar()">☰</button>

        <!-- Main Content Area -->
        <main class="main-content">
            <div class="main-content__inner">

                <!-- Feed View -->
                <div class="view view--active" id="feed-view">
                    <div class="feed-header">
                        <div class="section-header">
                            <div>
                                <h1 class="section-header__title">Your Feed</h1>
                                <p class="section-header__subtitle">Loading...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Read View -->
                <div class="view" id="read-view"></div>

                <!-- Topics View -->
                <div class="view" id="topics-view"></div>

                <!-- Settings View -->
                <div class="view" id="settings-view"></div>

                <!-- Reader View -->
                <div class="view" id="reader-view"></div>

            </div>
        </main>
    </div>

    <!-- JavaScript Modules -->
    <script src="js/db.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/rss.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/categorizer.js"></script>
    <script src="js/components.js"></script>
    <script src="js/reader.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
