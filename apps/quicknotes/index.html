<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quicknotes Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-orb page-orb-left"></div>
    <div class="page-orb page-orb-right"></div>

    <main class="keep-shell">
        <header class="topbar">
            <a class="back-link" href="../../index.html">&larr; Back to Dashboard</a>
            <span class="topbar-pill">Realtime sync</span>
        </header>

        <section class="toolbar">
            <label class="search-shell" for="search-input">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M10.5 4a6.5 6.5 0 1 1 0 13a6.5 6.5 0 0 1 0-13Zm0 2a4.5 4.5 0 1 0 0 9a4.5 4.5 0 0 0 0-9Zm8.91 10.5 2.59 2.59-1.41 1.41L18 17.91z"></path>
                </svg>
                <input id="search-input" type="search" placeholder="Search notes">
            </label>

            <div class="toolbar-actions">
                <span class="status-chip" id="board-status">Loading notes...</span>
                <button class="ghost-btn" id="clear-all-btn" type="button">Clear board</button>
            </div>
        </section>

        <section class="composer-wrap">
            <div class="composer-card is-compact" id="composer-shell" data-color="linen">
                <div class="compose-top">
                    <input id="composer-title" type="text" maxlength="120" placeholder="Title">
                    <button class="icon-btn" id="composer-lock-btn" type="button" aria-label="Lock note"></button>
                    <button class="icon-btn" id="composer-pin-btn" type="button" aria-label="Pin note"></button>
                </div>

                <textarea id="composer-content" placeholder="Take a note..."></textarea>

                <div class="compose-bottom">
                    <div class="palette" id="composer-colors"></div>

                    <div class="compose-meta">
                        <span class="color-label" id="composer-color-label">Warm paper</span>
                        <span class="save-status" id="composer-status">Start typing to create a note</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="empty-state" id="empty-state" hidden>
            <div class="empty-illustration"></div>
            <h2>No notes yet</h2>
            <p>Start typing in the composer above and your first note will appear instantly.</p>
        </section>

        <section class="notes-section" id="pinned-section" hidden>
            <div class="section-heading">
                <h2>Pinned</h2>
                <span id="pinned-section-count">0</span>
            </div>
            <div class="notes-board" id="pinned-notes"></div>
        </section>

        <section class="notes-section" id="other-section" hidden>
            <div class="section-heading">
                <h2>Notes</h2>
                <span id="other-section-count">0</span>
            </div>
            <div class="notes-board" id="other-notes"></div>
        </section>
    </main>

    <div class="editor-overlay" id="editor-overlay" hidden>
        <section class="editor-card" id="editor-card" data-color="linen" aria-modal="true" role="dialog">
            <div class="editor-header">
                <span class="editor-kicker">Editing note</span>
                <button class="icon-btn" id="editor-close-btn" type="button" aria-label="Close editor"></button>
            </div>

            <input id="editor-title" type="text" maxlength="120" placeholder="Title">
            <textarea id="editor-content" placeholder="Take a note..."></textarea>

            <div class="editor-footer">
                <div class="palette" id="editor-colors"></div>

                <div class="editor-actions">
                    <button class="action-btn" id="editor-lock-btn" type="button">Lock</button>
                    <button class="action-btn" id="editor-pin-btn" type="button">Pin</button>
                    <button class="action-btn" id="editor-duplicate-btn" type="button">Duplicate</button>
                    <button class="action-btn action-btn-danger" id="editor-delete-btn" type="button">Delete</button>
                </div>
            </div>

            <div class="editor-meta">
                <span class="save-status" id="editor-status">Saved</span>
                <span class="editor-timestamp" id="editor-timestamp"></span>
            </div>
        </section>
    </div>

    <div class="password-overlay" id="password-modal" hidden>
        <section class="password-card" aria-modal="true" role="dialog">
            <h3 id="password-modal-title">Set Password</h3>
            <p id="password-modal-message">Enter a password to encrypt this note.</p>
            <form id="password-modal-form">
                <input id="password-modal-input" type="password" required autocomplete="new-password" placeholder="Password">
                <div class="password-modal-error" id="password-modal-error" hidden>Incorrect password.</div>
                <div class="password-modal-actions">
                    <button type="button" class="ghost-btn" id="password-modal-cancel">Cancel</button>
                    <button type="submit" class="action-btn" id="password-modal-submit">Confirm</button>
                </div>
            </form>
        </section>
    </div>

    <script src="client.js"></script>
</body>
</html>
