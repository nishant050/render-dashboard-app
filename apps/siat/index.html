    <style>
        /* Mobile Reset & Utilities */
        * { -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; overflow: hidden; background-color: #f8fafc; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Slide Page Transition */
        .page {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #f8fafc;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            z-index: 50;
            display: flex;
            flex-direction: column;
        }
        .page.active { transform: translateX(0); }

        /* Loader */
        .loader {
            border: 3px solid #e2e8f0;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .tap-active:active { opacity: 0.7; transform: scale(0.98); }
    </style>

    <!-- ================= VIEW 1: DASHBOARD ================= -->
    <div id="dashboardView" class="flex flex-col h-full w-full bg-slate-50 relative z-10">
        
        <!-- Fixed Header -->
        <header class="bg-white px-4 pt-5 pb-2 shadow-sm z-20 shrink-0">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h1 class="text-2xl font-bold tracking-tight text-slate-900">Expo<span class="text-blue-600">Track</span></h1>
                    <p class="text-xs text-slate-500 font-medium">Personal Companion</p>
                </div>
                <!-- Progress Stats -->
                <div class="flex items-center gap-3 bg-slate-100 px-3 py-1.5 rounded-full">
                    <div class="text-center">
                        <span class="block text-[10px] uppercase text-slate-400 font-bold">Visited</span>
                        <span class="block text-sm font-bold text-slate-700 leading-none" id="statVisited">0</span>
                    </div>
                    <div class="w-px h-6 bg-slate-300"></div>
                    <div class="text-center">
                        <span class="block text-[10px] uppercase text-slate-400 font-bold">Left</span>
                        <span class="block text-sm font-bold text-slate-700 leading-none" id="statRemaining">0</span>
                    </div>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="relative mb-2">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" placeholder="Search stalls, names..." 
                       class="w-full bg-slate-100 text-slate-800 pl-10 pr-4 py-2.5 rounded-xl border-none focus:ring-2 focus:ring-blue-500 text-sm outline-none transition-all placeholder:text-slate-400">
            </div>

            <!-- Tabs -->
            <div class="flex border-b border-slate-100 mt-2">
                <button onclick="switchTab('all')" id="tab-all" class="flex-1 pb-3 text-sm font-semibold text-blue-600 border-b-2 border-blue-600 transition-colors">To Visit</button>
                <button onclick="switchTab('visited')" id="tab-visited" class="flex-1 pb-3 text-sm font-semibold text-slate-400 border-b-2 border-transparent transition-colors">Visited</button>
            </div>
        </header>

        <!-- Scrollable List -->
        <div id="companyList" class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-3 pb-24">
            <!-- Items injected via JS -->
        </div>

    </div>


    <!-- ================= VIEW 2: DETAIL PAGE (Slide Over) ================= -->
    <div id="detailView" class="page bg-white shadow-2xl">
        
        <!-- 1. FIXED NAVBAR (Always Visible) -->
        <nav class="h-16 bg-white border-b border-slate-100 flex items-center justify-between px-4 shrink-0 relative z-50">
            <!-- Back Button -->
            <button onclick="closeDetail()" class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-50 text-slate-600 tap-active">
                <i class="fa-solid fa-chevron-left"></i>

            <!-- Context Title -->

            <div class="px-4 pb-20 space-y-4">

"dSpace (Keynote)","Advanced Driver Assistance Systems (ADAS) & Autonomous Vehicles (3)","Caius seiger","Virtual Roads to Real Safety: Simulation and Digital Twins for ADAS Homologation","Day 3","11:30 - 13:00"
"Applus + IDIADA","Advanced Driver Assistance Systems (ADAS) & Autonomous Vehicles (3)","Mr. KRISHNATH SANKPAL","Adapting ADAS to Indian Driving and user Needs","Day 3","11:30 - 13:00"
"PSG iTech","Advanced Driver Assistance Systems (ADAS) & Autonomous Vehicles (3)","Mr. Arya A","Dynamic Integration of Bilateral and Adaptive Cruise Control for Intuitive Vehicle Behavior and Congestion Mitigation","Day 3","11:30 - 13:00"
"ARAI","Advanced Driver Assistance Systems (ADAS) & Autonomous Vehicles (3)","Chinmaya Sharma","Virtual Validation of ADAS Algorithms using Driver-in-the-loop Simulation","Day 3","11:30 - 13:00"
"WMG, University of Warwick","Advanced Driver Assistance Systems (ADAS) & Autonomous Vehicles (3)","Prof. Siddartha Khastgir","Crowdsourcing Indian traffic Scenarios for ADAS Development and Testing","",""`;

        // --- APP STATE ---
        let companies = [];
        let sessions = [];
        let userData = {}; // visited status, notes, AI data
        let currentCompany = null;
        let activeTab = 'all';

        // --- INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            loadUserData();
            parseCSV();
            parseSessionCSV();
            renderList();
            updateStats();

            document.getElementById('searchInput').addEventListener('input', (e) => renderList(e.target.value));
        });

        // --- STORAGE ---
        function loadUserData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) userData = JSON.parse(saved);
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(userData));
            updateStats();
        }

        // --- PARSING ---
        function parseCSV() {
            const lines = rawStallData.trim().split('\n');
            for (let i = 1; i < lines.length; i++) {
                const row = lines[i].match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
                if (row && row.length >= 2) {
                    const id = i.toString();
                    companies.push({
                        id: id,
                        stall: cleanField(row[0]),
                        name: cleanField(row[1]),
                        zone: row[2] ? cleanField(row[2]) : 'General'
                    });
                    if (!userData[id]) {
                        userData[id] = { visited: false, notes: "", contactName: "", contactInfo: "", aiData: null };
                    }
                }
            }
        }

        function parseSessionCSV() {
            const lines = rawSessionData.trim().split('\n');
            for (let i = 1; i < lines.length; i++) {
                const row = lines[i].match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
                if (row && row.length >= 6) {
                    sessions.push({
                        company: cleanField(row[0]),
                        category: cleanField(row[1]),
                        speaker: cleanField(row[2]),
                        topic: cleanField(row[3]),
                        date: cleanField(row[4]),
                        time: cleanField(row[5])
                    });
                }
            }
        }

        function cleanField(str) { return str ? str.replace(/^"|"$/g, '').trim() : ''; }

        // --- RENDER LIST ---
        function renderList(searchVal = "") {
            const container = document.getElementById('companyList');
            container.innerHTML = '';
            
            const term = searchVal.toLowerCase();
            const list = companies.filter(c => {
                const matchesSearch = c.name.toLowerCase().includes(term) || c.stall.toLowerCase().includes(term);
                const isVisited = userData[c.id].visited;
                const matchesTab = activeTab === 'all' ? !isVisited : isVisited;
                return matchesSearch && matchesTab;
            });

            if(list.length === 0) {
                container.innerHTML = `<div class="text-center mt-20 text-slate-400 text-sm">No items found.</div>`;
                return;
            }

            list.forEach(c => {
                const isVisited = userData[c.id].visited;
                const el = document.createElement('div');
                el.className = `bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center tap-active transition-colors ${isVisited ? 'opacity-70 bg-slate-50' : ''}`;
                el.onclick = () => openDetail(c);
                
                el.innerHTML = `
                    <div class="flex-1 min-w-0 pr-4">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 border border-slate-200">#${c.stall}</span>
                            ${isVisited ? '<i class="fa-solid fa-circle-check text-green-500 text-xs"></i>' : ''}
                        </div>
                        <h3 class="font-bold text-slate-800 text-sm leading-tight truncate">${c.name}</h3>
                        <p class="text-[10px] text-slate-400 mt-0.5 truncate">${c.zone}</p>
                    </div>
                    <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
                `;
                container.appendChild(el);
            });
        }

        function switchTab(tab) {
            activeTab = tab;
            document.getElementById('tab-all').className = tab === 'all' ? "flex-1 pb-3 text-sm font-semibold text-blue-600 border-b-2 border-blue-600 transition-colors" : "flex-1 pb-3 text-sm font-semibold text-slate-400 border-b-2 border-transparent transition-colors";
            document.getElementById('tab-visited').className = tab === 'visited' ? "flex-1 pb-3 text-sm font-semibold text-blue-600 border-b-2 border-blue-600 transition-colors" : "flex-1 pb-3 text-sm font-semibold text-slate-400 border-b-2 border-transparent transition-colors";
            document.getElementById('searchInput').value = '';
            renderList();
        }

        function updateStats() {
            const visited = Object.values(userData).filter(u => u.visited).length;
            const left = companies.length - visited;
            document.getElementById('statVisited').textContent = visited;
            document.getElementById('statRemaining').textContent = left;
        }

        // --- DETAIL VIEW LOGIC ---

        function openDetail(c) {
            currentCompany = c;
            const data = userData[c.id];

            // Populate Fixed Header
            document.getElementById('navStallNumber').textContent = `#${c.stall}`;
            updateVisitedBtnState(data.visited);

            // Populate Hero
            document.getElementById('detName').textContent = c.name;
            document.getElementById('detZone').textContent = c.zone;

            // Populate User Data
            document.getElementById('userNotes').value = data.notes || "";
            document.getElementById('contactName').value = data.contactName || "";
            document.getElementById('contactInfo').value = data.contactInfo || "";

            // Populate Sessions
            const mySessions = sessions.filter(s => {
                const n1 = s.company.toLowerCase().replace(/[.,]/g,'').trim();
                const n2 = c.name.toLowerCase().replace(/[.,]/g,'').trim();
                return n1.includes(n2) || n2.includes(n1);
            });
            
            const sessionList = document.getElementById('sessionList');
            const sessionCard = document.getElementById('sessionCard');
            sessionList.innerHTML = '';
            
            if(mySessions.length > 0) {
                sessionCard.classList.remove('hidden');
                mySessions.forEach(s => {
                    sessionList.innerHTML += `
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                            <div class="flex justify-between text-[10px] text-slate-400 mb-1">
                                <span class="font-bold uppercase tracking-wider text-purple-500">${s.category.split('(')[0]}</span>
                                <span>${s.date}</span>
                            </div>
                            <p class="text-xs font-bold text-slate-800 leading-snug mb-1">"${s.topic}"</p>
                            <div class="flex items-center gap-1.5 text-[10px] text-slate-500">
                                <div class="w-4 h-4 rounded-full bg-slate-200 flex items-center justify-center text-[8px]"><i class="fa-solid fa-user"></i></div>
                                ${s.speaker}
                            </div>
                        </div>
                    `;
                });
            } else {
                sessionCard.classList.add('hidden');
            }

            // AI Logic
            if (data.aiData) {
                renderAiData(data.aiData);
            } else {
                fetchAiData(c);
            }

            document.getElementById('detailView').classList.add('active');
        }

        function closeDetail() {
            document.getElementById('detailView').classList.remove('active');
            renderList(document.getElementById('searchInput').value);
        }

        // --- ACTIONS ---

        function toggleVisited() {
            if(!currentCompany) return;
            const id = currentCompany.id;
            const newState = !userData[id].visited;
            userData[id].visited = newState;
            updateVisitedBtnState(newState);
            saveState();
        }

        function updateVisitedBtnState(isVisited) {
            const btn = document.getElementById('navVisitedBtn');
            if(isVisited) {
                btn.className = "w-10 h-10 flex items-center justify-center rounded-full border border-green-200 bg-green-50 text-green-600 tap-active transition-all";
                btn.innerHTML = `<i class="fa-solid fa-check"></i>`;
            } else {
                btn.className = "w-10 h-10 flex items-center justify-center rounded-full border border-slate-200 bg-white text-slate-300 tap-active transition-all";
                btn.innerHTML = `<i class="fa-regular fa-circle-check text-xl"></i>`;
            }
        }

        function saveUserData() {
            if(!currentCompany) return;
            const id = currentCompany.id;
            
            userData[id].notes = document.getElementById('userNotes').value;
            userData[id].contactName = document.getElementById('contactName').value;
            userData[id].contactInfo = document.getElementById('contactInfo').value;
            
            saveState();
            
            // Visual feedback
            const btn = event.target;
            const oldText = btn.textContent;
            btn.textContent = "Saved!";
            btn.className = "w-full bg-green-600 text-white py-3 rounded-xl text-sm font-bold tap-active mt-2";
            setTimeout(() => {
                btn.textContent = oldText;
                btn.className = "w-full bg-slate-800 text-white py-3 rounded-xl text-sm font-bold tap-active mt-2";
            }, 1500);
        }

        // --- AI FETCH ---

        async function fetchAiData(c) {
            document.getElementById('aiContent').classList.add('opacity-30');
            document.getElementById('aiLoading').classList.remove('hidden');
            document.getElementById('refreshAiBtn').classList.add('hidden');

            const prompt = `Research "${c.name}" (Stall ${c.stall}). Return a JSON object with keys: "owner", "location", "turnover", "products" (simple HTML list). No markdown.`;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${GROQ_API_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "groq/compound",
                        messages: [
                            { role: "system", content: "You are a JSON-only bot. Output strict JSON." },
                            { role: "user", content: prompt }
                        ],
                        temperature: 0.1
                    })
                });

                const json = await response.json();
                let content = json.choices[0].message.content;
                
                // Robust Parse
                const start = content.indexOf('{');
                const end = content.lastIndexOf('}');
                if (start !== -1 && end !== -1) content = content.substring(start, end + 1);
                
                const aiData = JSON.parse(content);
                userData[c.id].aiData = aiData;
                saveState();
                renderAiData(aiData);

            } catch (err) {
                console.error(err);
                document.getElementById('aiProducts').innerHTML = `<span class="text-red-400">Connection Failed</span>`;
                document.getElementById('refreshAiBtn').classList.remove('hidden');
            } finally {
                document.getElementById('aiContent').classList.remove('opacity-30');
                document.getElementById('aiLoading').classList.add('hidden');
            }
        }

        function renderAiData(data) {
            document.getElementById('aiTurnover').textContent = data.turnover || "--";
            document.getElementById('aiOwner').textContent = data.owner || "--";
            document.getElementById('aiLocation').textContent = data.location || "--";
            
            const prodEl = document.getElementById('aiProducts');
            if(data.products && data.products.includes('<')) {
                prodEl.innerHTML = data.products;
                const ul = prodEl.querySelector('ul');
                if(ul) ul.className = "list-disc list-inside marker:text-blue-400 space-y-1";
            } else {
                prodEl.textContent = data.products || "No data available";
            }
        }

        function forceRefreshAI() {
            if(currentCompany) fetchAiData(currentCompany);
        }
    </script>
</body>
</html>
