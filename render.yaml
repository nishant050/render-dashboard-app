services:
  - type: web
    name: render-dashboard-app
    env: node
    plan: free
    buildCommand: "npm run render:build"
    startCommand: "npm start"
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: YTDLP_PATH
        sync: false
      - key: FFMPEG_PATH
        sync: false
